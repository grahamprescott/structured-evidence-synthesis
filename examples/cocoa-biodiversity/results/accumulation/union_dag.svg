  <!-- Interpretation note -->
  <g id="interpretation-note" transform="translate(50, 690)">
    <rect x="0" y="0" width="1280" height="160" rx="6" fill="#fff8e1" stroke="#a07000"/>
    <text x="20" y="22" font-size="13" font-weight="bold" fill="#532">Reading the cocoa biodiversity–yield DAG</text>
    <text x="20" y="46" font-size="11" fill="#333">• The headline trade-off lives on the <tspan font-weight="bold">agroforestry_vs_monoculture → cocoa_yield</tspan> edge (mixed valence, 8 rows). It splits cleanly into yield-magnitude (5 rows, all Negative) vs yield-stability/resilience (3 rows, all Positive).</text>
    <text x="20" y="66" font-size="11" fill="#333">• Same predictor → <tspan font-weight="bold">natural_enemy_abundance</tspan> is unanimously Positive (n=6). Cocoa agroforestry costs yield magnitude but supports the broader biodiversity / ecosystem-services bundle.</text>
    <text x="20" y="86" font-size="11" fill="#333">• <tspan font-weight="bold">functional_diversity_of_shade_trees → cocoa_yield</tspan> is Positive (n=4) — a key nuance: total shade is penalising, but selecting the right shade-tree species can recover yield.</text>
    <text x="20" y="106" font-size="11" fill="#333">• ★ marks the two Intervention-level rows: Toledo-Hernández hand-pollination (pollination_success → cocoa_yield, +51%-+161%) and Besse 1972 shade removal (lumped into agroforestry_vs_monoculture → cocoa_yield).</text>
    <text x="20" y="126" font-size="11" fill="#333">• <tspan font-weight="bold">Disagreement flags</tspan> on shade_tree_density edges reflect the native-vs-exotic stratification in Bisseleua 2013 — a vocabulary artefact, not a substantive conflict.</text>
    <text x="20" y="146" font-size="11" fill="#333">• Mediator chains visible: shade_tree_density → unproductive_cocoa_rate → cocoa_yield (Jagoret 2017); shade_index → input_cost → farmer_net_returns; pollinator_diversity → pollination_success → cocoa_yield (Abah 2025 + Kongor 2024 citing Toledo-Hernández).</text>
  </g>

