    <text x="20" y="122" font-size="11">Association (49 rows): all remaining; observational/regression</text>
    <text x="20" y="144" font-size="11" fill="#a07000" font-weight="bold">No primary cocoa-agroforestry vs monoculture RCT in this corpus.</text>
