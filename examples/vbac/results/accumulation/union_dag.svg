<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-pos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b7a3a"/>
    </marker>
    <marker id="arrow-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8262e"/>
    </marker>
    <marker id="arrow-mix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="20" font-weight="bold">VBAC consolidated DAG (v0.2.0-alpha)</text>
  <text x="700" y="50" text-anchor="middle" font-size="11" fill="#666">27 edges across 28 nodes — green = positive, red = negative, grey-dashed = mixed/indeterminate</text>
  <text x="700" y="65" text-anchor="middle" font-size="11" fill="#666">Edge thickness ∝ n_rows  ·  yellow halo + ! = disagreement_flag</text>

  <!-- Column headers -->
  <text x="220" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">PREDICTORS</text>
  <text x="700" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">TOLAC OUTCOMES</text>
  <text x="1180" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">SAFETY OUTCOMES</text>

  <!-- ============ EDGES (drawn first, behind nodes) ============ -->

  <!-- predictor edges into vbac_success (centre node at x=600..800, y=470..560) -->

  <!-- prior_vaginal_birth -> vbac_success (n=9, positive, disagreement) -->
  <line x1="260" y1="155" x2="600" y2="490" stroke="#1b7a3a" stroke-width="4" marker-end="url(#arrow-pos)"/>
  <text x="290" y="335" font-size="10" fill="#1b7a3a">+ (n=9) !</text>

  <!-- prior_successful_vbac -> vbac_success (n=6, positive) -->
  <line x1="260" y1="195" x2="600" y2="495" stroke="#1b7a3a" stroke-width="3" marker-end="url(#arrow-pos)"/>
  <text x="290" y="375" font-size="10" fill="#1b7a3a">+ (n=6)</text>

  <!-- prior_caesarean_indication_recurring -> vbac_success (n=11, negative, disagreement) -->
  <line x1="260" y1="235" x2="600" y2="500" stroke="#a8262e" stroke-width="5" marker-end="url(#arrow-neg)"/>
  <text x="295" y="395" font-size="10" fill="#a8262e">− (n=11) !</text>

  <!-- prior_caesarean_indication_non_recurring -> vbac_success (n=4, positive) -->
  <line x1="260" y1="275" x2="600" y2="505" stroke="#1b7a3a" stroke-width="3" marker-end="url(#arrow-pos)"/>
  <text x="290" y="425" font-size="10" fill="#1b7a3a">+ (n=4)</text>

  <!-- maternal_age -> vbac_success (n=9, negative, disagreement) -->
  <line x1="260" y1="315" x2="600" y2="510" stroke="#a8262e" stroke-width="4" marker-end="url(#arrow-neg)"/>
  <text x="295" y="450" font-size="10" fill="#a8262e">− (n=9) !</text>

  <!-- ethnicity -> vbac_success (n=6, negative) -->
  <line x1="260" y1="355" x2="600" y2="515" stroke="#a8262e" stroke-width="3" marker-end="url(#arrow-neg)"/>
  <text x="295" y="475" font-size="10" fill="#a8262e">− (n=6)</text>

  <!-- induction_of_labour -> vbac_success (n=7, negative) -->
  <line x1="260" y1="395" x2="600" y2="520" stroke="#a8262e" stroke-width="3" marker-end="url(#arrow-neg)"/>
  <text x="295" y="500" font-size="10" fill="#a8262e">− (n=7)</text>

  <!-- macrosomia -> vbac_success (n=9, negative) -->
  <line x1="260" y1="435" x2="600" y2="525" stroke="#a8262e" stroke-width="4" marker-end="url(#arrow-neg)"/>
  <text x="350" y="500" font-size="10" fill="#a8262e">− (n=9)</text>

  <!-- maternal_bmi -> vbac_success (n=4, negative) -->
  <line x1="260" y1="475" x2="600" y2="530" stroke="#a8262e" stroke-width="3" marker-end="url(#arrow-neg)"/>
  <text x="380" y="525" font-size="10" fill="#a8262e">− (n=4)</text>

  <!-- inter_delivery_interval -> vbac_success (n=4, mixed, disagreement) -->
  <line x1="260" y1="515" x2="600" y2="535" stroke="#888" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrow-mix)"/>
  <text x="400" y="540" font-size="10" fill="#888">~ (n=4) !</text>

  <!-- parity -> vbac_success (n=4, positive) -->
  <line x1="260" y1="555" x2="600" y2="540" stroke="#1b7a3a" stroke-width="3" marker-end="url(#arrow-pos)"/>
  <text x="380" y="560" font-size="10" fill="#1b7a3a">+ (n=4)</text>

  <!-- epidural_analgesia -> vbac_success (n=2, negative) -->
  <line x1="260" y1="595" x2="600" y2="545" stroke="#a8262e" stroke-width="2" marker-end="url(#arrow-neg)"/>
  <text x="380" y="580" font-size="10" fill="#a8262e">− (n=2)</text>

  <!-- cervical_dilation_at_admission -> vbac_success (n=2, positive) -->
  <line x1="260" y1="635" x2="600" y2="550" stroke="#1b7a3a" stroke-width="2" marker-end="url(#arrow-pos)"/>
  <text x="380" y="610" font-size="10" fill="#1b7a3a">+ (n=2)</text>

  <!-- gestational_age -> vbac_success (n=3, negative) -->
  <line x1="260" y1="675" x2="600" y2="555" stroke="#a8262e" stroke-width="2" marker-end="url(#arrow-neg)"/>
  <text x="380" y="640" font-size="10" fill="#a8262e">− (n=3)</text>

  <!-- preeclampsia -> vbac_success (n=2, mixed, disagreement) -->
  <line x1="260" y1="715" x2="600" y2="560" stroke="#888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-mix)"/>
  <text x="385" y="670" font-size="10" fill="#888">~ (n=2) !</text>

  <!-- gestational_diabetes -> vbac_success (n=3, negative) -->
  <line x1="260" y1="755" x2="600" y2="565" stroke="#a8262e" stroke-width="2" marker-end="url(#arrow-neg)"/>
  <text x="385" y="700" font-size="10" fill="#a8262e">− (n=3)</text>

  <!-- socioeconomic_status -> vbac_success (n=3, positive) -->
  <line x1="260" y1="795" x2="600" y2="570" stroke="#1b7a3a" stroke-width="2" marker-end="url(#arrow-pos)"/>
  <text x="385" y="730" font-size="10" fill="#1b7a3a">+ (n=3)</text>

  <!-- labour_augmentation -> vbac_success (n=1, negative) -->
  <line x1="260" y1="835" x2="600" y2="575" stroke="#a8262e" stroke-width="1.5" marker-end="url(#arrow-neg)"/>
  <text x="385" y="760" font-size="9" fill="#a8262e">− (n=1)</text>

  <!-- station_at_admission -> vbac_success (n=1, positive) -->
  <line x1="260" y1="875" x2="600" y2="580" stroke="#1b7a3a" stroke-width="1.5" marker-end="url(#arrow-pos)"/>
  <text x="385" y="785" font-size="9" fill="#1b7a3a">+ (n=1)</text>

  <!-- cervical_dilation_at_prior_cs -> vbac_success (n=1, positive) -->
  <line x1="260" y1="915" x2="600" y2="585" stroke="#1b7a3a" stroke-width="1.5" marker-end="url(#arrow-pos)"/>
  <text x="385" y="810" font-size="9" fill="#1b7a3a">+ (n=1)</text>

  <!-- premature_rupture_of_membranes -> vbac_success (n=1, negative) -->
  <line x1="260" y1="955" x2="600" y2="590" stroke="#a8262e" stroke-width="1.5" marker-end="url(#arrow-neg)"/>
  <text x="385" y="835" font-size="9" fill="#a8262e">− (n=1)</text>

  <!-- duration_first_stage -> vbac_success (n=2, negative) -->
  <line x1="260" y1="995" x2="600" y2="595" stroke="#a8262e" stroke-width="2" marker-end="url(#arrow-neg)"/>
  <text x="385" y="870" font-size="10" fill="#a8262e">− (n=2)</text>

  <!-- ethnicity -> duration_first_stage (cross-link, n=1, positive) -->
  <path d="M 290 365 Q 30 670 245 990" stroke="#1b7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrow-pos)"/>
  <text x="40" y="690" font-size="9" fill="#1b7a3a">+ (n=1)</text>

  <!-- ====== tolac_failure intermediate node and its downstream edges ====== -->
  <!-- tolac_failure node now placed at y=730..790 — well below vbac_success, on its own row -->
  <!-- tolac_failure -> maternal_morbidity (n=5, positive) -->
  <line x1="800" y1="745" x2="1110" y2="700" stroke="#1b7a3a" stroke-width="3" marker-end="url(#arrow-pos)"/>
  <text x="900" y="710" font-size="10" fill="#1b7a3a">+ (n=5)</text>

  <!-- tolac_failure -> uterine_rupture (n=2, positive) -->
  <line x1="800" y1="775" x2="1110" y2="850" stroke="#1b7a3a" stroke-width="2" marker-end="url(#arrow-pos)"/>
  <text x="930" y="820" font-size="10" fill="#1b7a3a">+ (n=2)</text>

  <!-- explanatory edge: vbac_success implicitly REDUCES tolac_failure (definitional, not an extracted edge — shown dotted) -->
  <line x1="700" y1="610" x2="700" y2="725" stroke="#666" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="710" y="670" font-size="9" font-style="italic" fill="#666">definitional:</text>
  <text x="710" y="682" font-size="9" font-style="italic" fill="#666">vbac_success = NOT tolac_failure</text>

  <!-- oxytocin_use -> uterine_rupture (n=3, positive) -->
  <line x1="260" y1="455" x2="1110" y2="845" stroke="#1b7a3a" stroke-width="2" marker-end="url(#arrow-pos)"/>
  <text x="680" y="685" font-size="10" fill="#1b7a3a">+ (n=3) inc. prostaglandins</text>

  <!-- uterine_scar_thickness -> uterine_rupture (n=1, negative) -->
  <line x1="260" y1="1035" x2="1110" y2="855" stroke="#a8262e" stroke-width="1.5" marker-end="url(#arrow-neg)"/>
  <text x="700" y="990" font-size="9" fill="#a8262e">− (n=1)</text>

  <!-- ============ NODES ============ -->
  <!-- Left column: predictors -->
  <g id="predictors">
    <rect x="40" y="140" width="220" height="30" rx="4" fill="#e8e8e8" stroke="#666"/>
    <text x="150" y="160" text-anchor="middle" font-size="11">prior_vaginal_birth</text>

    <rect x="40" y="180" width="220" height="30" rx="4" fill="#e8e8e8" stroke="#666"/>
    <text x="150" y="200" text-anchor="middle" font-size="11">prior_successful_vbac</text>

    <rect x="40" y="220" width="220" height="30" rx="4" fill="#d8d8d8" stroke="#666"/>
    <text x="150" y="240" text-anchor="middle" font-size="11">prior_caesarean_indication_recurring</text>

    <rect x="40" y="260" width="220" height="30" rx="4" fill="#e8e8e8" stroke="#666"/>
    <text x="150" y="280" text-anchor="middle" font-size="11">prior_caesarean_indication_non_recurring</text>

    <rect x="40" y="300" width="220" height="30" rx="4" fill="#e0e0e0" stroke="#666"/>
    <text x="150" y="320" text-anchor="middle" font-size="11">maternal_age</text>

    <rect x="40" y="340" width="220" height="30" rx="4" fill="#dadada" stroke="#666"/>
    <text x="150" y="360" text-anchor="middle" font-size="11">ethnicity</text>

    <rect x="40" y="380" width="220" height="30" rx="4" fill="#e0e0e0" stroke="#666"/>
    <text x="150" y="400" text-anchor="middle" font-size="11">induction_of_labour</text>

    <rect x="40" y="420" width="220" height="30" rx="4" fill="#e0e0e0" stroke="#666"/>
    <text x="150" y="440" text-anchor="middle" font-size="11">macrosomia</text>

    <rect x="40" y="460" width="220" height="30" rx="4" fill="#e8e8e8" stroke="#666"/>
    <text x="150" y="480" text-anchor="middle" font-size="11">maternal_bmi</text>

    <rect x="40" y="500" width="220" height="30" rx="4" fill="#e8e8e8" stroke="#666"/>
    <text x="150" y="520" text-anchor="middle" font-size="11">inter_delivery_interval</text>

    <rect x="40" y="540" width="220" height="30" rx="4" fill="#e8e8e8" stroke="#666"/>
    <text x="150" y="560" text-anchor="middle" font-size="11">parity</text>

    <rect x="40" y="580" width="220" height="30" rx="4" fill="#f0f0f0" stroke="#999"/>
    <text x="150" y="600" text-anchor="middle" font-size="11">epidural_analgesia</text>

    <rect x="40" y="620" width="220" height="30" rx="4" fill="#f0f0f0" stroke="#999"/>
    <text x="150" y="640" text-anchor="middle" font-size="11">cervical_dilation_at_admission</text>

    <rect x="40" y="660" width="220" height="30" rx="4" fill="#f0f0f0" stroke="#999"/>
    <text x="150" y="680" text-anchor="middle" font-size="11">gestational_age</text>

    <rect x="40" y="700" width="220" height="30" rx="4" fill="#f0f0f0" stroke="#999"/>
    <text x="150" y="720" text-anchor="middle" font-size="11">preeclampsia</text>

    <rect x="40" y="740" width="220" height="30" rx="4" fill="#f0f0f0" stroke="#999"/>
    <text x="150" y="760" text-anchor="middle" font-size="11">gestational_diabetes</text>

    <rect x="40" y="780" width="220" height="30" rx="4" fill="#f0f0f0" stroke="#999"/>
    <text x="150" y="800" text-anchor="middle" font-size="11">socioeconomic_status</text>

    <rect x="40" y="820" width="220" height="30" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <text x="150" y="840" text-anchor="middle" font-size="11">labour_augmentation</text>

    <rect x="40" y="860" width="220" height="30" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <text x="150" y="880" text-anchor="middle" font-size="11">station_at_admission</text>

    <rect x="40" y="900" width="220" height="30" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <text x="150" y="920" text-anchor="middle" font-size="11">cervical_dilation_at_prior_cs</text>

    <rect x="40" y="940" width="220" height="30" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <text x="150" y="960" text-anchor="middle" font-size="11">premature_rupture_of_membranes</text>

    <rect x="40" y="980" width="220" height="30" rx="4" fill="#f0f0f0" stroke="#999"/>
    <text x="150" y="1000" text-anchor="middle" font-size="11">duration_first_stage</text>

    <rect x="40" y="1020" width="220" height="30" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <text x="150" y="1040" text-anchor="middle" font-size="11">uterine_scar_thickness</text>
  </g>

  <!-- Centre top: vbac_success node -->
  <g id="success-outcome">
    <rect x="600" y="475" width="200" height="135" rx="8" fill="#9eb5c9" stroke="#234"/>
    <text x="700" y="515" text-anchor="middle" font-size="14" font-weight="bold">vbac_success</text>
    <text x="700" y="535" text-anchor="middle" font-size="10">degree: 19</text>
    <text x="700" y="555" text-anchor="middle" font-size="10" fill="#234">(primary VBAC outcome —</text>
    <text x="700" y="570" text-anchor="middle" font-size="10" fill="#234">vaginal delivery achieved)</text>
    <text x="700" y="595" text-anchor="middle" font-size="9" fill="#a07000">5 incoming edges flagged</text>
  </g>

  <!-- Centre bottom: tolac_failure node (now clearly distinct from vbac_success) -->
  <g id="failure-outcome">
    <rect x="600" y="725" width="200" height="70" rx="8" fill="#d8a8a8" stroke="#532"/>
    <text x="700" y="752" text-anchor="middle" font-size="14" font-weight="bold">tolac_failure</text>
    <text x="700" y="770" text-anchor="middle" font-size="9" fill="#532">(TOLAC ends in</text>
    <text x="700" y="784" text-anchor="middle" font-size="9" fill="#532">emergency repeat CS)</text>
  </g>

  <!-- Right: safety outcomes -->
  <g id="safety-outcomes">
    <rect x="1110" y="680" width="200" height="40" rx="6" fill="#c9b59e" stroke="#432"/>
    <text x="1210" y="705" text-anchor="middle" font-size="12" font-weight="bold">maternal_morbidity</text>

    <rect x="1110" y="830" width="200" height="40" rx="6" fill="#c9b59e" stroke="#432"/>
    <text x="1210" y="855" text-anchor="middle" font-size="12" font-weight="bold">uterine_rupture</text>
  </g>

  <!-- Disagreement halo around vbac_success -->
  <circle cx="700" cy="540" r="80" fill="none" stroke="#e4c01a" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Interpretation note next to tolac_failure (clarifies direction) -->
  <g id="interpretation-note" transform="translate(820, 805)">
    <rect x="0" y="0" width="300" height="60" rx="4" fill="#fff8e1" stroke="#a07000"/>
    <text x="10" y="16" font-size="10" font-weight="bold" fill="#532">Reading the safety edges:</text>
    <text x="10" y="32" font-size="10" fill="#333">tolac_failure → morbidity / rupture: positive</text>
    <text x="10" y="46" font-size="10" fill="#333">means FAILED TOLAC raises these outcomes,</text>
    <text x="10" y="56" font-size="9" font-style="italic" fill="#666">not successful VBAC. Successful VBAC is safer.</text>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(900, 1030)">
    <rect x="0" y="0" width="320" height="130" fill="#fafafa" stroke="#ccc"/>
    <text x="160" y="20" text-anchor="middle" font-size="12" font-weight="bold">Legend</text>
    <line x1="20" y1="40" x2="60" y2="40" stroke="#1b7a3a" stroke-width="3" marker-end="url(#arrow-pos)"/>
    <text x="70" y="44" font-size="11">Positive valence</text>
    <line x1="20" y1="60" x2="60" y2="60" stroke="#a8262e" stroke-width="3" marker-end="url(#arrow-neg)"/>
    <text x="70" y="64" font-size="11">Negative valence</text>
    <line x1="20" y1="80" x2="60" y2="80" stroke="#888" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrow-mix)"/>
    <text x="70" y="84" font-size="11">Mixed / indeterminate</text>
    <text x="20" y="105" font-size="11">! = disagreement_flag</text>
    <text x="20" y="120" font-size="11">Thickness ∝ n_rows</text>
  </g>
</svg>
